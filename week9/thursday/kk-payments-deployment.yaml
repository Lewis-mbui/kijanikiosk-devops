apiVersion: apps/v1
kind: Deployment

metadata:
  name: kk-payments
  annotations:
    kubernetes.io/change-cause: "Extract all config to ConfigMap and Secret"
  labels:
    app: kk-payments
    week: "9"

spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: kk-payments

  template:
    metadata:
      labels:
        app: kk-payments
        version: "1.0.0"

    spec:
      imagePullSecrets:
        - name: kijani-registry-credentials

      containers:
        - name: kk-payments
          image: lewis0648/kk-payments:1.1.0-1da0173

          ports:
            - containerPort: 3001

          env:
            - name: APP_VERSION
              value: "1.1.0-1da0173"

          envFrom:
            - configMapRef:
                name: kk-payments-config
            - secretRef:
                name: kk-payments-secrets

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "500m"
