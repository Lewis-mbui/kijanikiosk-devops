apiVersion: apps/v1
kind: Deployment

metadata:
  name: kk-payments
  annotations:
    kubernetes.io/change-cause: "Phase 2: Update kk-payments to v1.2.0-bad (regression test)"
  labels:
    app: kk-payments
    week: "9"

spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: kk-payments

  template:
    metadata:
      labels:
        app: kk-payments
        version: "1.0.0"

    spec:
      imagePullSecrets:
        - name: kijani-registry-credentials

      containers:
        - name: kk-payments
          image: lewis0648/kk-payments:1.2.0-bad

          ports:
            - containerPort: 3001

          env:
            - name: NODE_ENV
              value: "production"

            - name: PORT
              value: "3001"

            - name: APP_VERSION
              value: "1.2.0-bad"

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "500m"
