apiVersion: v1
kind: Pod
metadata:
  name: kk-payments-private
  labels:
    app: kk-payments
spec:
  imagePullSecrets:
    - name: kijani-registry-credentials

  containers:
    - name: kk-payments
      image: lewis0648/kk-payments:1.0.0-dec816a
      imagePullPolicy: Always

      ports:
        - name: http
          containerPort: 3001

      env:
        - name: PORT
          value: "3001"
        - name: APP_VERSION
          value: "v1.0.0"
