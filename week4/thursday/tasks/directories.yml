---
- name: Ensure KijaniKiosk base directory exists
  ansible.builtin.file:
    path: "{{ base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create KijaniKiosk directory structure
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ base_dir }}/api"
      owner: kk-api
      group: kk-api
      mode: "0750"

    - path: "{{ base_dir }}/payments"
      owner: kk-payments
      group: kk-payments
      mode: "0750"

    - path: "{{ base_dir }}/logs"
      owner: kk-logs
      group: kk-logs
      mode: "0750"

    - path: "{{ base_dir }}/config"
      owner: root
      group: "{{ service_group }}"
      mode: "0750"

    - path: "{{ base_dir }}/scripts"
      owner: root
      group: root
      mode: "0755"

    - path: "{{ base_dir }}/shared"
      owner: root
      group: root
      mode: "0755"

    - path: "{{ log_dir }}"
      owner: kk-logs
      group: "{{ service_group }}"
      mode: "2770"

    - path: "{{ base_dir }}/health"
      owner: kk-logs
      group: "{{ service_group }}"
      mode: "0750"

- name: Configure shared log ACLs
  ansible.posix.acl:
    path: "{{ log_dir }}"
    entity: "{{ item.entity }}"
    etype: "{{ item.etype }}"
    permissions: "{{ item.permissions }}"
    state: present
    default: "{{ item.default | default(false) }}"
  loop:
    - entity: kk-api
      etype: user
      permissions: rwx

    - entity: kk-payments
      etype: user
      permissions: r-x

    - entity: ubuntu
      etype: user
      permissions: r-x

    - entity: kk-api
      etype: user
      permissions: rwx
      default: true

    - entity: kk-payments
      etype: user
      permissions: r-x
      default: true

    - entity: ubuntu
      etype: user
      permissions: r-x
      default: true
  when: not ansible_check_mode

- name: Remove redundant health user ACL
  ansible.posix.acl:
    path: "{{ base_dir }}/health"
    entity: kk-logs
    etype: user
    state: absent
  when: not ansible_check_mode

- name: Remove redundant default health user ACL
  ansible.posix.acl:
    path: "{{ base_dir }}/health"
    entity: kk-logs
    etype: user
    default: true
    state: absent
  when: not ansible_check_mode

- name: Remove redundant normal health group ACL
  ansible.posix.acl:
    path: "{{ base_dir }}/health"
    entity: "{{ service_group }}"
    etype: group
    state: absent
  when: not ansible_check_mode

- name: Configure default health directory ACL
  ansible.posix.acl:
    path: "{{ base_dir }}/health"
    entity: "{{ service_group }}"
    etype: group
    permissions: r-x
    state: present
    default: true
  when: not ansible_check_mode
