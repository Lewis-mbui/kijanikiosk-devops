---
- name: Create persistent journal directory
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: Create journald configuration directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy journald configuration
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/kijanikiosk.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: Create journal files
  ansible.builtin.command:
    cmd: systemd-tmpfiles --create --prefix /var/log/journal
  changed_when: false
  when: not ansible_check_mode
